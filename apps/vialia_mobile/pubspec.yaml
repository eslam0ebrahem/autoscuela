name: vialia_mobile
description: Standalone Flutter app for Vialia exam preparation.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bcrypt: ^1.1.3
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  go_router: ^16.3.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  mongo_dart: ^0.10.8
  shared_preferences: ^2.5.3
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
